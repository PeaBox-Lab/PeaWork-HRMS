{% extends 'base.html' %}{% block content %}<header><div><h1>Add employee</h1><p>Create the employee record and initial effective-dated hire event.</p></div></header><form method="post" class="card formgrid"><label>Employee number<input name="employee_no" placeholder="PW0003" required></label><label>First name<input name="first_name" required></label><label>Last name<input name="last_name" required></label><label>Work email<input type="email" name="work_email"></label><label>Phone<input name="phone"></label><label>Date of joining<input type="date" name="date_of_joining" required></label><label>Employment type<select name="employment_type"><option>Full-time</option><option>Part-time</option><option>Contractor</option><option>Intern</option></select></label><label>Location<input name="location" value="Gurugram"></label><label>Department<select name="department_id"><option value="">Unassigned</option>{% for x in departments %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label><label>Position<select name="position_id"><option value="">Unassigned</option>{% for x in positions %}<option value="{{x.id}}">{{x.title}} ({{x.code}})</option>{% endfor %}</select></label><label>Manager<select name="manager_id"><option value="">None</option>{% for x in managers %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label><div class="actions"><button>Create employee</button><a href="/employees">Cancel</a></div></form>{% endblock %}
