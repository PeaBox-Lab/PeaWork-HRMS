<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}PeaWork{% endblock %}</title><link rel="stylesheet" href="/static/style.css"></head><body>{% if user %}<aside><div class="brand"><span class="pea">   </span> PeaWork<small>HRIS v0.4.0</small></div><nav><a href="/">Dashboard</a><a href="/employees">People</a><a href="/organization">Organization</a><a href="/leave">Leave</a><a href="/workforce">Workforce</a><a href="/talent">Talent</a><a href="/documents">Documents</a><a href="/recruitment">Recruitment</a><a href="/onboarding">Onboarding</a><a href="/reports">Reports</a>{% if user.role=='admin' %}<a href="/audit">Audit Trail</a><a href="/settings">Settings</a>{% endif %}</nav><div class="user">{{user.username}}<small>{{user.role}}</small><a href="/logout">Sign out</a></div></aside>{% endif %}<main class="{% if not user %}full{% endif %}">{% block content %}{% endblock %}</main><script>document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',()=>{let b=f.querySelector('[type=submit]');if(b){b.disabled=true;b.dataset.old=b.innerText;b.innerText='Working   '}}));</script></body></html>
