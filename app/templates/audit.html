{% extends 'base.html' %}{% block content %}<header><div><h1>Audit trail</h1><p>Security and compliance evidence for sensitive HR actions.</p></div></header><section class="card"><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr>{% for x in rows %}<tr><td>{{x.created_at}}</td><td>{{x.actor}}</td><td><b>{{x.action}}</b></td><td>{{x.entity_type}} #{{x.entity_id}}</td><td>{{x.details}}</td></tr>{% endfor %}</table></section>{% endblock %}
