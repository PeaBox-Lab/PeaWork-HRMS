{% extends 'base.html' %}{% block content %}<header><div><h1>Settings</h1><p>Local deployment configuration and access control.</p></div></header><div class="grid2"><section class="card"><h2>System settings</h2>{% for x in settings %}<form method="post" class="inline"><input name="key" value="{{x.key}}" readonly><input name="value" value="{{x.value}}"><button>Save</button></form>{% endfor %}</section><section class="card"><h2>Users</h2>{% for x in users %}<div class="row"><b>{{x.username}}</b><span>{{x.role}}</span></div>{% endfor %}<form method="post" action="/settings/users" class="stack"><h3>Add user</h3><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Temporary password" required><select name="role"><option>employee</option><option>manager</option><option>recruiter</option><option>payroll</option><option>hr</option><option>admin</option></select><button>Create user</button></form></section></div>{% endblock %}
