services:
  peawork:
    build: .
    ports: ["8090:8090"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PEAWORK_ENV: cloud-beta
      PEAWORK_SECRET: ${PEAWORK_SECRET}
      PEAWORK_DATABASE_URL: postgresql://peawork:${POSTGRES_PASSWORD}@postgres:5432/peawork
      PEAWORK_CONTROL_DATABASE: /app/control/control.db
      PEAWORK_STORAGE_BACKEND: s3
      PEAWORK_OBJECT_ENDPOINT: http://minio:9000
      PEAWORK_OBJECT_BUCKET: ${PEAWORK_OBJECT_BUCKET:-peawork}
      PEAWORK_OBJECT_REGION: ${PEAWORK_OBJECT_REGION:-india-central}
      PEAWORK_OBJECT_ENCRYPTION: AES256
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - peawork_control:/app/control
      - peawork_backups:/app/backups
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: peawork
      POSTGRES_USER: peawork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - peawork_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peawork -d peawork"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - peawork_objects:/data
    ports: ["9001:9001"]
volumes:
  peawork_control:
  peawork_backups:
  peawork_postgres:
  peawork_objects:
